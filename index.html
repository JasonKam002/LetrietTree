<!DOCTYPE html>
<html lang ="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="/icon.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>


    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Green Space</title>
  </head>
  <body>
      <div class="sidebar">
        <div class="header">
          <img src="logo.png" alt="Logo" class="logo" />
          <h1>Double T Green</h1>
        </div>

        <ul class="logging">
          <form class="form">
              <div class="form__row">
                  <label class="form__label">Category</label>
                  <select class="form__input form__input--category">
                  <option value="tree">Tree</option>
                  <option value="bird">Bird</option>
                  </select>
              </div>
              <div class="form__row">
                  <label class="form__label">Name of Planter</label>
                  <input class="form__input form__input--name"/>
              </div>
              <div class="form__row">
                  <label class="form__label">Species</label>
                  <input class="form__input form__input--species"/>
              </div>
              <div class="form__row">
                <label class="form__label age">Date planted</label>
                <input
                  class="form__input form__input--age"
                />
              </div>
              <div class="form__row form__row--hidden">
                <label class="form__label numBird">Number of birds</label>
                <input
                  class="form__input form__input--numBird"
                />
              </div>
              <button class="image">Upload image</button>
              <br>
              <button type="submit">Submit</button>
              </form>
        </ul>

        <div class="description">
          <h1>Description of </h1>
          <div class="list">
            <h3>Type: </h3>
            <h3>Age: </h3>
            <h3>Species: </h3>
            <h3>Planter: </h3>
            <h3>Location: </h3>
          </div>

          <div class="gallery">
            <img class="img" src="template.png">
            <img class="img" src="template.png">
            <img class="img" src="template.png">
            <img class="img" src="template.png">
          </div>
        </div>
      </div>
          

      <div id="map"></div>
    <script defer src="script.js"></script>
  </body>
</html>

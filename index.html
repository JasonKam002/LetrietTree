<!DOCTYPE html>
<html lang ="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="/icon.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>


    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Green Space</title>
  </head>
  <body>
      <div class="sidebar">
        <div class="header">
          <div class="title">
            <img src="logo.png" alt="Logo" class="logo" />
            <h1>Double T Green</h1>
            <h3>Charlottetown Rural Highschool</h3>
          </div>
          
          <div class="topbar">
            <button class="topbar-button" id="record">Record</button>
            <button class="topbar-button" id="search">Search</button>
          </div>
        </div>

        <ul class="logging">
          <form class="form">
              <div class="form__row">
                  <label class="form__label">Category</label>
                  <select class="form__input form__input--category">
                  <option value="tree">Tree</option>
                  <option value="bird">Bird</option>
                  </select>
              </div>
              <div class="form__row">
                  <label class="form__label">Name of Planter</label>
                  <input class="form__input form__input--name" placeholder="e.g. Jason"/>
              </div>
              <div class="form__row">
                  <label class="form__label">Species</label>
                  <input class="form__input form__input--species" placeholder="e.g. Oak/ Eagle"/>
              </div>
              <div class="form__row">
                <label class="form__label age">Date planted</label>
                <input
                  class="form__input form__input--age";
                  placeholder="e.g. 2026-02-06"
                />
              </div>
              <div class="form__row">
                <label class="form__label numBird">Number of birds</label>
                <input
                  class="form__input form__input--numBird";
                  placeholder="e.g. 4"
                />
              </div>
              <div class="buttons">
                <label for="image" class="form__label">Upload Image</label>
                <input type="file" id="image" accept="image/*">
                <button class="submit" type="submit">Submit</button>
              </div>
              </form>
        </ul>

        <div class="searchBar">
          <form>
            <label class="form__label">Search</label>
            <input id="searchID" placeholder="name/ species">
            <button type='submit' class="submit" id="searchBtn">Search</button>
          </form>
          <div id="results"></div>
        </div>
      </div>

          

      <div id="map"></div>
    <script defer src="script.js"></script>
  </body>
</html>
